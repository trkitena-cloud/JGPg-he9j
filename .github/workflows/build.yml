
name: NoxNo APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        shell: bash
        run: |
          ROOT=""
          for f in $(find . -type f -name gradlew); do
            d=$(dirname "$f")
            if [ -f "$d/settings.gradle.kts" ] && [ -f "$d/app/build.gradle.kts" ]; then
              ROOT="$d"
              break
            fi
          done

          if [ -z "$ROOT" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found: $ROOT"

      - name: Check protocol
        run: |
          test -f relay/Protocol/settings.gradle.kts
        working-directory: ${{ env.PROJECT_ROOT }}

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          GRADLE_OPTS: "-Xmx4g -Dfile.encoding=UTF-8"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxNo-1.3-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
